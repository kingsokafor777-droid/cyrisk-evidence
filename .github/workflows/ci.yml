name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: git clone https://github.com/kingsokafor777-droid/cyrisk-core.git ../cyrisk-core
      - run: git -C ../cyrisk-core checkout 4d68f385ef382a6420466dff0196244a2c915f1f
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ../cyrisk-core
      - run: python -m pip install -e .
      - run: make check
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: git clone https://github.com/kingsokafor777-droid/cyrisk-core.git ../cyrisk-core
      - run: git -C ../cyrisk-core checkout 4d68f385ef382a6420466dff0196244a2c915f1f
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ../cyrisk-core
      - run: python -m pip install -e .
      - run: make check
