name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: git clone https://github.com/kingsokafor777-droid/cyrisk-core.git ../cyrisk-core
      - run: git -C ../cyrisk-core checkout 4d68f385ef382a6420466dff0196244a2c915f1f
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ../cyrisk-core
      - run: python -m pip install -e .
      - run: make check
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: git clone https://github.com/kingsokafor777-droid/cyrisk-core.git ../cyrisk-core
      - run: git -C ../cyrisk-core checkout 4d68f385ef382a6420466dff0196244a2c915f1f
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ../cyrisk-core
      - run: python -m pip install -e .
      - run: make check
